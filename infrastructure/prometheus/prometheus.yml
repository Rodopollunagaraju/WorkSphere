global: { scrape_interval: 5s, evaluation_interval: 5s }
rule_files: [/etc/prometheus/rules.yml]
scrape_configs:
  - job_name: worksphere
    metrics_path: /metrics
    static_configs:
      - targets: ['api-gateway:3000', 'auth-service:4001', 'project-service:4002', 'task-service:4003', 'notification-service:4004', 'analytics-service:4005']

groups:
  - name: worksphere
    rules:
      - alert: KafkaConsumerLagHigh
        expr: sum by (group, topic) (kafka_consumer_lag) > 1000
        for: 2m
        labels: { severity: warning }
        annotations: { summary: "Consumer group {{ $labels.group }} is {{ $value }} messages behind on {{ $labels.topic }}" }
      - alert: OutboxBacklog
        expr: outbox_pending > 100
        for: 1m
        labels: { severity: warning }
        annotations: { summary: "{{ $labels.service }} has {{ $value }} unpublished outbox events (Kafka down or relay stuck?)" }
      - alert: HighErrorRate
        expr: sum by (service) (rate(http_request_duration_seconds_count{status=~"5.."}[2m])) / sum by (service) (rate(http_request_duration_seconds_count[2m])) > 0.05
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "{{ $labels.service }} 5xx rate above 5%" }
      - alert: SlowRequestsP95
        expr: histogram_quantile(0.95, sum by (le, service) (rate(http_request_duration_seconds_bucket[2m]))) > 1
        for: 3m
        labels: { severity: warning }
        annotations: { summary: "{{ $labels.service }} p95 latency above 1s" }
      - alert: ServiceDown
        expr: up == 0
        for: 30s
        labels: { severity: critical }
        annotations: { summary: "{{ $labels.instance }} is down" }
